name: Release Colored Tags Mod plugin

# Every push to master publishes the version in manifest.json: the tag and the
# GitHub release are created if they do not exist yet, otherwise the release
# assets are replaced. Bump the version for BRAT to offer an update.
on:
  push:
    branches:
      - master
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Resolve release version
        id: version
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "${manifest_version}" = "$(node -p "require('./package.json').version")"
          test "${manifest_version}" = "$(node -p "require('./dist/manifest.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "${manifest_version}"; fi
          for asset in dist/main.js dist/manifest.json dist/styles.css; do
            test -s "${asset}"
          done
          echo "version=${manifest_version}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "${VERSION}" dist/main.js dist/manifest.json dist/styles.css \
              --target "${GITHUB_SHA}" --title "Colored Tags Mod ${VERSION}" --generate-notes
          fi
